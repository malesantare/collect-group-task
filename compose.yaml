name: wallet-watcher
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wallet_watcher
      POSTGRES_DB: wallet_watcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:db first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_watcher -d wallet_watcher"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
